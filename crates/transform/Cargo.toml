[package]
name = "crucible-transform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crucible-abi = { path = "../abi" }
crucible-compiler = { path = "../compiler" }
crucible-luau = { path = "../luau" }
serde_json.workspace = true

[features]
# Exports `analyze` and the facts the transform keeps, which only this crate's tests read.
test-support = ["crucible-compiler/test-support"]

# Tests build with dev-dependencies, so this turns test-support on for them and for nothing else.
[dev-dependencies]
crucible-transform = { path = ".", features = ["test-support"] }
