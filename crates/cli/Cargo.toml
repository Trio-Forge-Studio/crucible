[package]
name = "crucible"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crucible-oc = { path = "../oc" }
oc-registry = { path = "../oc-registry" }
crucible-compiler = { path = "../compiler" }
serde.workspace = true
serde_json.workspace = true
jsonc-parser = { version = "0.27", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
toml = "1"
dirs = "6"
percent-encoding = "2"
url = "2"
tempfile = "3"
rojo = "=7.7.1"
sha2 = "0.10"
semver = "1"
env_logger = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
nucleo-matcher = "0.3"
open = "5"
unicode-width = "0.2"

[build-dependencies]
mermaid-text = "0.58"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-create"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
] }

[dev-dependencies]
httpmock = "0.8"
rmp-serde = "1"
portable-pty = "0.9"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
vt100 = "0.18"
