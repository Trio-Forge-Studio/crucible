name: Release

on:
  pull_request:
    paths:
      - "cli/**"
      - "packages/crucible/**"
      - "docs/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
            binary: crucible
          - platform: win32-x64
            runner: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            binary: crucible.exe
          - platform: darwin-arm64
            runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            binary: crucible
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup show && rustup target add '${{ matrix.target }}'
      - if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: cli
          key: release-${{ matrix.target }}
      - if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: |
          cargo build --release --locked --package crucible --target '${{ matrix.target }}'
      - name: Verify static musl binary
        if: matrix.platform == 'linux-x64'
        run: |
          binary=target/${{ matrix.target }}/release/crucible
          file "$binary" | tee binary-file.txt
          grep -E 'ELF 64-bit.*x86-64.*static(ally linked|-pie linked)' binary-file.txt
          ldd "$binary" > binary-ldd.txt 2>&1 || true
          cat binary-ldd.txt
          grep -E 'not a dynamic executable|statically linked' binary-ldd.txt
      - name: Sign and verify native arm64 binary
        if: matrix.platform == 'darwin-arm64'
        run: |
          test "$(uname -m)" = arm64
          binary=target/${{ matrix.target }}/release/crucible
          codesign --force --sign - "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          file "$binary" | tee binary-file.txt
          grep 'Mach-O 64-bit executable arm64' binary-file.txt
      - if: matrix.platform == 'darwin-arm64'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify Windows static CRT
        if: matrix.platform == 'win32-x64'
        run: node npm/check-pe.mjs target/${{ matrix.target }}/release/crucible.exe
      - name: Build runtime for installed package tests
        if: matrix.platform == 'darwin-arm64'
        working-directory: .
        run: pnpm install --frozen-lockfile && pnpm --filter @trioforge/crucible build:transformer && pnpm --filter @trioforge/crucible build
      - name: Exercise release binary through npm
        run: |
          export CRUCIBLE_BINARY="$PWD/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          "$CRUCIBLE_BINARY" --version
          "$CRUCIBLE_BINARY" oc find asset
      - name: Test installed packages on Mac
        if: matrix.platform == 'darwin-arm64'
        run: CRUCIBLE_BINARY="$PWD/target/${{ matrix.target }}/release/${{ matrix.binary }}" node --test npm/package.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-${{ matrix.platform }}
          path: cli/target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  packages:
    needs: binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: binary-*
          path: build/binaries
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - name: Build runtime and transformer
        run: |
          pnpm build
      - name: Generate notices from locked dependencies
        working-directory: cli
        run: |
          cargo install cargo-about --version 0.8.4 --locked
          node npm/notices.mjs ../build/THIRD_PARTY_NOTICES
      - name: Stage five packages at the Cargo version
        run: |
          for platform in linux-x64 win32-x64 darwin-arm64; do
            mv "build/binaries/binary-$platform" "build/binaries/$platform"
          done
          node cli/npm/release.mjs build/binaries build/release build/THIRD_PARTY_NOTICES
      - name: Test registry preflight and partial publication recovery
        run: node --test cli/npm/registry.test.mjs
      - name: Reject previously used release versions
        if: github.event_name == 'push'
        run: node cli/npm/registry.mjs preflight build/release/tarballs
      - name: Prove publish packaging without credentials
        run: |
          for package in build/release/tarballs/*.tgz; do
            npm publish "$package" --dry-run --access public --ignore-scripts
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-release
          path: build/release/tarballs/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release
          path: packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish platforms and runtime before the shim
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY_PRIVATE" = false || { echo 'npm provenance requires a public source repository'; exit 1; }
          test -n "$NODE_AUTH_TOKEN"
          node cli/npm/registry.mjs publish packages
