[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oc-registry = { path = "../crates/registry" }
proc-macro2 = "1"
quote = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit-mut"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
