# Each mutant changes one line of Provision.tla. `cargo xtask tla` checks that TLC finds a counterexample to the
# property each one names, so every property is shown to catch the bug it is there for.

[[mutant]]
name = "create-ignores-the-list"
why = "A create runs although the list found the key's resource."
breaks = "AtMostOne"
find = '''
Create(k) ==
    /\ pc = "ready"
    /\ lock[k] = 0
    /\ k \notin blocked
    /\ seen[k] = {}
'''
replace = '''
Create(k) ==
    /\ pc = "ready"
    /\ lock[k] = 0
    /\ k \notin blocked
'''

[[mutant]]
name = "adopt-trusts-the-typed-id"
why = "`crucible adopt` writes the ID it is given without reading the resource."
breaks = "LockNamesExisting"
find = '''
    /\ i \in Sought(k)
'''
replace = '''
'''

[[mutant]]
name = "create-again-after-unknown"
why = "A run sends a second create for a key after the first one's answer was lost."
breaks = "NoBlindCreate"
find = '''
    /\ k \notin blocked
    /\ seen[k] = {}
'''
replace = '''
    /\ seen[k] = {}
'''

[[mutant]]
name = "list-result-ignored"
why = "A list runs, and the run creates without looking at what it found."
breaks = "NoBlindCreate"
find = '''
    /\ seen' = [k \in Keys |-> IF lock[k] = 0 THEN Candidates(k) ELSE {}]
'''
replace = '''
    /\ seen' = [k \in Keys |-> {}]
'''

[[mutant]]
name = "create-before-intent"
why = "The create is sent before its intent reaches the journal."
breaks = "JournalCoversUnknown"
find = '''
    /\ seen[k] = {}
    /\ journal[k] = want[k]
'''
replace = '''
    /\ seen[k] = {}
'''

[[mutant]]
name = "blocked-for-good"
why = "Rule 1 holds per environment instead of per run, so a key whose create was lost before it landed is never created."
breaks = "Converges"
find = '''
    /\ blocked' = {}
'''
replace = '''
    /\ blocked' = blocked
'''

[[mutant]]
name = "list-misses-recent-creates"
why = "Assumption A1 fails: the list can miss a resource that exists, so the adopt check finds nothing."
breaks = "AtMostOne"
find = '''
    /\ seen' = [k \in Keys |-> IF lock[k] = 0 THEN Candidates(k) ELSE {}]
'''
replace = '''
    /\ seen' \in [Keys -> SUBSET Ids] /\ \A k \in Keys : seen'[k] \subseteq IF lock[k] = 0 THEN Candidates(k) ELSE {}
'''

[[mutant]]
name = "two-keys-one-name"
why = "crucible.toml lets two keys of one kind share a display name, so a resource with that name is a candidate of both and every run stops."
breaks = "FaultFreeBinds"
find = '''
Distinct(w) == \A k, j \in Keys : k # j => w[k] # w[j]
'''
replace = '''
Distinct(w) == TRUE
'''

[[mutant]]
name = "adopt-with-two-candidates"
why = "The adopt check takes one of two matches instead of stopping the run."
breaks = "LockNamesExisting"
find = '''
    /\ Cardinality(seen[k]) = 1
'''
replace = '''
    /\ Cardinality(seen[k]) >= 1
'''

[[mutant]]
name = "refuse-every-run"
why = "The plan refuses every run, so nothing is ever provisioned. Converges still holds, because a refused run is a stuck one."
breaks = "FaultFreeBinds"
find = '''
Refused == \E k, j \in Keys : k # j /\ lock[j] = 0 /\ journal[j] = want[k]
'''
replace = '''
Refused == TRUE
'''

[[mutant]]
name = "adopt-check-ignores-new-ids"
why = "The adopt check after an unknown outcome looks only for the declared name, so a create renamed on Roblox after its answer was lost is not found and is made again."
breaks = "AtMostOne"
find = '''
New(k) == IF journal[k] = None THEN {} ELSE Ids \ before[k]
'''
replace = '''
New(k) == {}
'''

[[mutant]]
name = "intent-while-another-is-unresolved"
why = "An intent is written and its create sent while another key's create may have landed, so that resource is new to the intent."
breaks = "NoBlindCreate"
find = '''
    /\ journal[k] = None
    /\ ~OtherPending(k)
'''
replace = '''
    /\ journal[k] = None
'''

[[mutant]]
name = "adopt-by-id-takes-a-shared-candidate"
why = "`crucible adopt` accepts a resource that another key without a lock entry would adopt."
breaks = "LockNamesExisting"
find = '''
    /\ \A j \in Keys \ {k} : lock[j] = 0 => i \notin Sought(j)
'''
replace = '''
'''

[[mutant]]
name = "a-refused-create-keeps-its-intent"
why = "A create Roblox refused keeps its intent, so a resource someone makes by hand afterwards stops every run, though nothing was created."
breaks = "Converges"
find = '''
    /\ journal' = [journal EXCEPT ![reply.key] = None]
    /\ rejected' = rejected \cup {reply.key}
'''
replace = '''
    /\ journal' = journal
    /\ rejected' = rejected \cup {reply.key}
'''

[[mutant]]
name = "adopt-a-new-id-of-another-name"
why = "After an unknown outcome, a run adopts a resource new since the intent that carries another name, which may be one someone made by hand."
breaks = "BoundRightly"
find = '''
Candidates(k) == Match(want[k]) \ Locked
'''
replace = '''
Candidates(k) == Sought(k)
'''
