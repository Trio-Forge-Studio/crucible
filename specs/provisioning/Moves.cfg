\* expect: pass
\* One provisioner. `p2` declares `moved_from = "p"`, and `p` may already exist
\* by hand. Every invariant and property must hold.
CONSTANTS
    Provs = {P1}
    Keys = {"p", "p2"}
    Kind <- MCKind
    Base <- MCBase
    MovedFrom <- MCMoved
    Vers = {1, 2}
    MaxId = 3
    FreeQuota = 1
    BadgeCost = 0
    MaxFaults <- MCUnbounded
    MaxEdits <- MCUnbounded
    ListLag = FALSE
    LoseLocal = FALSE
    Handmade = {"p"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AtMostOneRemotePerKey
    LockNamesExisting
    LockInjective
    LockOwnsItsResource
    NoBlindCreate
    NoCreateBesideMatch
    NoPaidBadge
    RemovedIsError
    RunAdvances
PROPERTIES
    NoSilentDelete
    NoSilentRetire
    MovedKeepsId
CHECK_DEADLOCK FALSE
