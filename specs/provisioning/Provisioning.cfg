\* expect: pass
\* One provisioner, a product and a badge with the same display name, and a
\* product that may already exist by hand. Every safety property must hold.
CONSTANTS
    Provs = {P1}
    Keys = {"p", "b"}
    Kind <- MCKind
    Base <- MCBase
    MovedFrom <- MCNoMoves
    Vers = {1, 2}
    MaxId <- MCIds21
    PageCount = 2
    FreeQuota = 1
    BadgeCost = 0
    MaxFaults <- MCUnbounded
    MaxEdits <- MCUnbounded
    ListLag = FALSE
    LoseLocal = {}
    Handmade = {"p"}
    Careful = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AtMostOneRemotePerKey
    JournalCoversCreates
    LockNamesExisting
    LockInjective
    LockOwnsItsResource
    NoBlindCreate
    NoCreateBesideMatch
    NoPaidBadge
    RemovedIsError
    RunAdvances
PROPERTIES
    NoSilentDelete
    NoSilentRetire
    MovedKeepsId
CHECK_DEADLOCK FALSE
