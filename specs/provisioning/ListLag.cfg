    Base <- MCBase
    MovedFrom <- MCNoMoves
    Vers = {1, 2}
    MaxId = 2
    FreeQuota = 1
    BadgeCost = 0
    MaxFaults <- MCUnbounded
    MaxEdits <- MCUnbounded
    ListLag = TRUE
    LoseLocal = FALSE
    Handmade = {}
SPECIFICATION Spec
INVARIANT AtMostOneRemotePerKey
CHECK_DEADLOCK FALSE
