\* expect: pass
\* Liveness under fairness: the developer reruns provision, and edits and faults
\* eventually stop. Every managed key gets a lock entry or a reported deferral.
CONSTANTS
    Provs = {P1}
    Keys = {"p", "p2", "b"}
    Kind <- MCKind
    Base <- MCBase
    MovedFrom <- MCMoved
    Vers = {1, 2}
    MaxId = 4
    FreeQuota = 1
    BadgeCost = 0
    MaxFaults = 2
    MaxEdits = 2
    ListLag = FALSE
    LoseLocal = FALSE
    Handmade = {"p"}
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
PROPERTIES
    Progress
CHECK_DEADLOCK FALSE
