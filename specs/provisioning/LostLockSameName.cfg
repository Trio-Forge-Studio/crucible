\* expect: pass
\* A checkout that loses its uncommitted lock and journal, with no config edit.
\* Adopt-by-name finds the resource again, so no key gets a second resource.
CONSTANTS
    Provs = {P1}
    Keys = {"p", "b"}
    Kind <- MCKind
    Base <- MCBase
    MovedFrom <- MCNoMoves
    Vers = {1, 2}
    MaxId = 2
    FreeQuota = 1
    BadgeCost = 0
    MaxFaults <- MCUnbounded
    MaxEdits = 0
    ListLag = FALSE
    LoseLocal = TRUE
    Handmade = {}
SPECIFICATION Spec
INVARIANTS
    AtMostOneRemotePerKey
    LockNamesExisting
    LockInjective
    NoPaidBadge
CHECK_DEADLOCK FALSE
