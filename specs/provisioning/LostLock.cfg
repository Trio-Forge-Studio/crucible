\* expect: pass
\* A checkout can lose its uncommitted lock, and the config can then rename
\* the resource. The reviewer declines a create shown beside the key's own
\* orphan, and the operator adopts the orphan instead.
CONSTANTS
    Provs = {P1}
    Keys = {"p"}
    Kind <- MCKind
    Base <- MCBase
    MovedFrom <- MCNoMoves
    Vers = {1, 2}
    MaxId <- MCIds21
    PageCount = 2
    FreeQuota = 1
    BadgeCost = 0
    MaxFaults <- MCUnbounded
    MaxEdits <- MCUnbounded
    ListLag = FALSE
    LoseLocal = {"lock"}
    Handmade = {}
    Careful = TRUE
SPECIFICATION Spec
INVARIANTS
    AtMostOneRemotePerKey
    NoBlindCreate
    LockNamesExisting
    LockInjective
CHECK_DEADLOCK FALSE
