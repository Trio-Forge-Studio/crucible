\* expect: violation AtMostOneRemotePerKey
\* A checkout that loses its uncommitted lock and journal, then renames the
\* resource. Adopt-by-name searches the new name and creates again. TLC must
\* report AtMostOneRemotePerKey violated.
CONSTANTS
    Provs = {P1}
    Keys = {"p"}
    Kind <- MCKind
    Base <- MCBase
    MovedFrom <- MCNoMoves
    Vers = {1, 2}
    MaxId = 2
    FreeQuota = 1
    BadgeCost = 0
    MaxFaults <- MCUnbounded
    MaxEdits <- MCUnbounded
    ListLag = FALSE
    LoseLocal = TRUE
    Handmade = {}
SPECIFICATION Spec
INVARIANT AtMostOneRemotePerKey
CHECK_DEADLOCK FALSE
